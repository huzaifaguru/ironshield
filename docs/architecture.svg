<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1300 560" width="1300" height="560" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#161616"/>
    </marker>
    <marker id="arrowGreen" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#198038"/>
    </marker>
  </defs>

  <rect width="1300" height="560" fill="#ffffff"/>

  <!-- Title -->
  <text x="650" y="38" text-anchor="middle" font-size="24" font-weight="700" fill="#161616">IronShield: Real-Time Fraud &amp; Mule Detection on IBM LinuxONE</text>

  <!-- LinuxONE container -->
  <rect x="20" y="70" width="1070" height="420" rx="14" fill="#edf5ff" stroke="#0f62fe" stroke-width="2.5"/>
  <text x="40" y="128" font-size="15" font-weight="700" fill="#0f62fe">IBM Z / LinuxONE</text>

  <!-- Feedback loop (drawn first so boxes sit on top) -->
  <path d="M1195,220 L1195,100 L640,100 L640,130" fill="none" stroke="#198038" stroke-width="2" stroke-dasharray="7,5" marker-end="url(#arrowGreen)"/>
  <rect x="820" y="86" width="230" height="22" rx="4" fill="#ffffff"/>
  <text x="935" y="102" text-anchor="middle" font-size="12" font-weight="600" fill="#198038">Analyst feedback → model retraining</text>

  <!-- Box 1: Transaction Stream -->
  <rect x="40" y="220" width="150" height="70" rx="8" fill="#ffffff" stroke="#161616" stroke-width="1.5"/>
  <text x="115" y="250" text-anchor="middle" font-size="14" font-weight="700" fill="#161616">Transaction Stream</text>
  <text x="115" y="270" text-anchor="middle" font-size="11" fill="#525252">TabFormer / PaySim replay</text>

  <!-- Box 2: Privacy Layer -->
  <rect x="215" y="220" width="150" height="70" rx="8" fill="#ffffff" stroke="#8a3ffc" stroke-width="2"/>
  <text x="290" y="250" text-anchor="middle" font-size="14" font-weight="700" fill="#161616">Privacy Layer</text>
  <text x="290" y="270" text-anchor="middle" font-size="11" fill="#525252">hashed account IDs</text>

  <!-- Box 3: Feature Engine -->
  <rect x="390" y="220" width="150" height="70" rx="8" fill="#ffffff" stroke="#161616" stroke-width="1.5"/>
  <text x="465" y="250" text-anchor="middle" font-size="14" font-weight="700" fill="#161616">Feature Engine</text>
  <text x="465" y="270" text-anchor="middle" font-size="11" fill="#525252">velocity · ratios · time</text>

  <!-- Box 4a: Risk Model -->
  <rect x="565" y="130" width="150" height="70" rx="8" fill="#ffffff" stroke="#0f62fe" stroke-width="2"/>
  <text x="640" y="160" text-anchor="middle" font-size="14" font-weight="700" fill="#161616">Risk Scoring Model</text>
  <text x="640" y="180" text-anchor="middle" font-size="11" fill="#525252">XGBoost / Snap ML</text>

  <!-- Box 4b: Mule Graph -->
  <rect x="565" y="310" width="150" height="70" rx="8" fill="#ffffff" stroke="#0f62fe" stroke-width="2"/>
  <text x="640" y="340" text-anchor="middle" font-size="13" font-weight="700" fill="#161616">Mule Graph Detector</text>
  <text x="640" y="360" text-anchor="middle" font-size="11" fill="#525252">fan-in / fan-out · NetworkX</text>

  <!-- Box 5: Decision Engine -->
  <rect x="740" y="220" width="150" height="70" rx="8" fill="#ffffff" stroke="#161616" stroke-width="1.5"/>
  <text x="815" y="250" text-anchor="middle" font-size="14" font-weight="700" fill="#161616">Decision Engine</text>
  <text x="815" y="270" text-anchor="middle" font-size="11" fill="#525252">risk fusion + SHAP reasons</text>

  <!-- Box 6: Alert API -->
  <rect x="915" y="220" width="150" height="70" rx="8" fill="#ffffff" stroke="#161616" stroke-width="1.5"/>
  <text x="990" y="250" text-anchor="middle" font-size="14" font-weight="700" fill="#161616">Alert API</text>
  <text x="990" y="270" text-anchor="middle" font-size="11" fill="#525252">FastAPI · REST</text>

  <!-- Box 7: Dashboard (outside LinuxONE) -->
  <rect x="1120" y="220" width="150" height="70" rx="8" fill="#ffffff" stroke="#198038" stroke-width="2"/>
  <text x="1195" y="250" text-anchor="middle" font-size="14" font-weight="700" fill="#161616">Analyst Dashboard</text>
  <text x="1195" y="270" text-anchor="middle" font-size="11" fill="#525252">Streamlit · approve / block</text>

  <!-- Arrows -->
  <line x1="190" y1="255" x2="213" y2="255" stroke="#161616" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="365" y1="255" x2="388" y2="255" stroke="#161616" stroke-width="2" marker-end="url(#arrow)"/>
  <path d="M540,255 L552,255 L552,165 L563,165" fill="none" stroke="#161616" stroke-width="2" marker-end="url(#arrow)"/>
  <path d="M540,255 L552,255 L552,345 L563,345" fill="none" stroke="#161616" stroke-width="2" marker-end="url(#arrow)"/>
  <path d="M715,165 L727,165 L727,255 L738,255" fill="none" stroke="#161616" stroke-width="2" marker-end="url(#arrow)"/>
  <path d="M715,345 L727,345 L727,255 L738,255" fill="none" stroke="#161616" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="890" y1="255" x2="913" y2="255" stroke="#161616" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="1065" y1="255" x2="1118" y2="255" stroke="#161616" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Arrow labels -->
  <text x="640" y="222" text-anchor="middle" font-size="11" font-style="italic" fill="#0f62fe">fraud score in ms</text>
  <text x="640" y="400" text-anchor="middle" font-size="11" font-style="italic" fill="#0f62fe">mule-ring alerts</text>
  <text x="290" y="310" text-anchor="middle" font-size="11" font-style="italic" fill="#8a3ffc">no real identities beyond this point</text>
  <text x="815" y="310" text-anchor="middle" font-size="11" font-style="italic" fill="#525252">"12× avg amount, new device…"</text>

  <!-- Platform strengths strip -->
  <rect x="40" y="425" width="1030" height="46" rx="8" fill="#d0e2ff"/>
  <text x="555" y="454" text-anchor="middle" font-size="13" font-weight="600" fill="#001d6c">On-chip AI inference (Telum)   ·   Pervasive encryption   ·   High-volume transaction throughput   ·   Enterprise reliability</text>

  <!-- Footer -->
  <text x="650" y="530" text-anchor="middle" font-size="13" fill="#525252">Team Big Iron Brains · IBM Z Datathon 2026 · Theme: Real-Time AI for Critical Decisions</text>
</svg>
